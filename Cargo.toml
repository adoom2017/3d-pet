[workspace]
members = ["crates/desktop-pet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "metal", "std", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
