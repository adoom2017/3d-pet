[workspace]
members = ["crates/desktop-pet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = "0.30.9"
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
pollster = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "metal", "std", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
tempfile = "3.23.0"
